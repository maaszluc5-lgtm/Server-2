# Nginx-Seite für minesgames.duckdns.org -> Mine auf Port 4100.
#
# Nur der Port-80-Block steht hier. Den 443-Block mit dem Zertifikat trägt
# certbot beim ersten Lauf selbst ein — deshalb diese Datei danach nicht mehr
# einfach überschreiben.

server {
    listen 80;
    listen [::]:80;
    server_name minesgames.duckdns.org;

    # Spielstände sind klein, aber der Server nimmt bis 512 KB an.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
