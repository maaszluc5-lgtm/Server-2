<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Server Terminal</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root{ --bg:#0b1220; --panel:#111a2e; --line:#1e2c4a; --txt:#e6edf7; --muted:#8296b8; --accent:#38bdf8; --accent2:#0ea5e9; --danger:#ff5d6c; --ok:#34d399; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--txt); height:100dvh; overflow:hidden; -webkit-tap-highlight-color:transparent}
  /* login */
  #login{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:radial-gradient(120% 80% at 50% -10%,#13223f,#0b1220)}
  .card{width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px 22px; box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .card h1{margin:0 0 4px; font-size:22px; display:flex; align-items:center; gap:9px}
  .card .sub{color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.5}
  .card label{display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px; font-weight:700}
  .card input{width:100%; background:#0c1526; border:1px solid var(--line); color:var(--txt); border-radius:11px; padding:13px 14px; font-size:16px; font-weight:600}
  .card input:focus{outline:2px solid var(--accent); border-color:var(--accent)}
  .card button{margin-top:14px; width:100%; border:0; cursor:pointer; font:inherit; font-weight:800; font-size:15px; padding:13px; border-radius:11px; background:linear-gradient(180deg,var(--accent),var(--accent2)); color:#03121f}
  .card button:active{transform:translateY(1px)}
  .err{color:var(--danger); font-size:13px; min-height:18px; margin-top:10px; font-weight:600}
  .warn{margin-top:16px; font-size:11px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px; line-height:1.5}
  /* app */
  #app{display:none; flex-direction:column; height:100dvh}
  .bar{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line)}
  .bar .dot{width:9px; height:9px; border-radius:50%; background:var(--muted)} .bar .dot.on{background:var(--ok)} .bar .dot.off{background:var(--danger)}
  .bar .title{font-weight:800; font-size:14px; letter-spacing:.02em}
  .bar .status{color:var(--muted); font-size:12px}
  .bar .spacer{flex:1}
  .bar button{border:1px solid var(--line); background:#0c1526; color:var(--txt); border-radius:9px; padding:7px 12px; font-weight:700; font-size:12px; cursor:pointer}
  .termwrap{flex:1; min-height:0; background:#05080f; padding:8px}
  #term{width:100%; height:100%}
  .xterm{height:100%}
</style>
</head>
<body>
  <div id="login">
    <div class="card">
      <h1>🖥️ <span>Server Terminal</span></h1>
      <p class="sub">Melde dich an, um eine Shell auf deinem Server zu öffnen — Befehle wie in PowerShell/SSH, direkt im Browser.</p>
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" autofocus>
      <button id="go">Verbinden</button>
      <div class="err" id="err"></div>
      <div class="warn">🔒 Diese Seite gibt Voll-Zugriff auf deinen Server. Teile die Adresse & das Passwort mit niemandem. Nutze ein starkes Passwort.</div>
    </div>
  </div>

  <div id="app">
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span class="title">Server Terminal</span>
      <span class="status" id="status">verbinde…</span>
      <span class="spacer"></span>
      <button id="clr">Leeren</button>
      <button id="dc">Trennen</button>
    </div>
    <div class="termwrap"><div id="term"></div></div>
  </div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var ws=null, term=null, fit=null, connected=false;
  function wsUrl(){ return (location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/term'; }

  $('#go').addEventListener('click', connect);
  $('#pw').addEventListener('keydown', function(e){ if(e.key==='Enter') connect(); });

  function connect(){
    var pass=$('#pw').value; if(!pass){ $('#err').textContent='Bitte Passwort eingeben'; return; }
    $('#err').textContent='Verbinde…';
    try{ ws=new WebSocket(wsUrl()); }catch(e){ $('#err').textContent='Verbindung fehlgeschlagen'; return; }
    ws.onopen=function(){ ws.send(JSON.stringify({t:'auth',pass:pass,cols:80,rows:24})); };
    ws.onmessage=function(ev){ var m; try{m=JSON.parse(ev.data);}catch(_){return;}
      if(m.t==='denied'){ $('#err').textContent='Falsches Passwort'; try{ws.close();}catch(_){}
      } else if(m.t==='ok'){ startTerm(); }
      else if(m.t==='out'){ if(term) term.write(m.d); }
      else if(m.t==='exit'){ setStatus(false,'Shell beendet'); }
    };
    ws.onclose=function(){ setStatus(false,'getrennt'); };
    ws.onerror=function(){ $('#err').textContent='Server nicht erreichbar'; };
  }

  function startTerm(){
    $('#login').style.display='none'; $('#app').style.display='flex';
    term=new Terminal({ cursorBlink:true, fontFamily:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace', fontSize:14,
      theme:{ background:'#05080f', foreground:'#e6edf7', cursor:'#38bdf8', selectionBackground:'#1e3a5f',
        black:'#0b1220', red:'#ff5d6c', green:'#34d399', yellow:'#fbbf24', blue:'#38bdf8', magenta:'#c084fc', cyan:'#22d3ee', white:'#e6edf7',
        brightBlack:'#4b5f85', brightRed:'#ff8088', brightGreen:'#6ee7b7', brightYellow:'#fde68a', brightBlue:'#7dd3fc', brightMagenta:'#d8b4fe', brightCyan:'#67e8f9', brightWhite:'#ffffff' } });
    fit=new FitAddon.FitAddon(); term.loadAddon(fit);
    term.open($('#term')); doFit(); term.focus();
    term.onData(function(d){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({t:'in',d:d})); });
    setStatus(true,'verbunden');
    window.addEventListener('resize', doFit);
  }
  function doFit(){ if(!fit) return; try{ fit.fit(); if(ws&&ws.readyState===1) ws.send(JSON.stringify({t:'resize',cols:term.cols,rows:term.rows})); }catch(e){} }
  function setStatus(on,txt){ connected=on; $('#dot').className='dot '+(on?'on':'off'); $('#status').textContent=txt; }

  $('#clr').addEventListener('click', function(){ if(term) term.clear(); });
  $('#dc').addEventListener('click', function(){ try{ws&&ws.close();}catch(e){} location.reload(); });
})();
</script>
</body>
</html>
