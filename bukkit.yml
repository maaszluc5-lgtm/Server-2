settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: Server wird neu gestartet!
spawn-limits:
  monsters: 70
  animals: 10
  water-animals: 5
  water-ambient: 20
  ambient: 15
chunk-gc:
  period-in-ticks: 600
ticks-per:
  animal-spawns: 400
  monster-spawns: 1
  water-spawns: 1
  ambient-spawns: 1
  autosave: 6000
worlds:
  Survival:
    generator: default
  Nether:
    generator: default
  End:
    generator: default
  Creative:
    generator: default
  Skyblock:
    generator: VoidGenerator
  PvP_Arena:
    generator: default
  Lobby:
    generator: default
  Resource:
    generator: default
  Adventure:
    generator: default
  Hardcore:
    generator: default
